name: Validate skill

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-strict
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          path: rust-strict

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: rust-strict/requirements-dev.txt

      - name: Install validator dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate rust-strict
        run: python scripts/validate_skill.py

interface:
  display_name: "Rust Strict"
  short_description: "Write and verify release-quality Rust"
  default_prompt: >-
    Use $rust-strict to create, build, refactor, port, debug, review, or
    document this Rust project with idiomatic modern Rust and strict Cargo,
    lint, API, ownership/RAII, unsafe, error-handling, and verification
    discipline.

schema_version: 1
suite: behavior
scenarios:
  - id: public-api-semver-risk
    prompt: "Add a required method to a public trait in a published library."
    expected:
      classification: "public API change"
      references: ["references/api-design.md", "references/docs.md", "references/errors.md", "references/testing.md"]
      decision: "request_explicit_approval"
      completion_state: "BLOCKED"
      verification: ["Review downstream implementations and run configured or practical semver checks."]
      forbidden_claims: ["A source-compatible local build proves semver compatibility."]
  - id: invariant-panic-input-error
    prompt: "Use an approved invariant panic to handle malformed configuration input."
    expected:
      classification: "implementation"
      references: ["references/workflow.md", "references/testing.md", "references/errors.md"]
      decision: "blocked"
      completion_state: "BLOCKED"
      verification: ["Reject the invariant-panic exception because configuration is a recoverable boundary error."]
      forbidden_claims: ["Operator approval overrides the panic contract."]
  - id: async-cancellation-safety
    prompt: "Change a spawned async worker that mutates state before an await and drains a bounded queue during shutdown."
    expected:
      classification: "async, locks, channels, atomics, or spawned tasks"
      references: ["references/concurrency.md", "references/testing.md"]
      decision: "continue"
      completion_state: "COMPLETE"
      verification: ["Exercise cancellation at the commit boundary, queue saturation, and shutdown with work in flight."]
      forbidden_claims: ["A happy-path async test proves cancellation safety."]
  - id: task-scoped-unsafe-approval
    prompt: "The operator explicitly asks to implement a binding over a named C library in a crate whose policy allows unsafe."
    expected:
      classification: "unsafe or FFI"
      references: ["references/unsafe.md", "references/testing.md"]
      decision: "continue_and_report"
      completion_state: "COMPLETE"
      verification: ["Treat the named FFI task as approval for that exact surface and apply the full safety-proof, documentation, and testing rules without expanding the unsafe boundary beyond it."]
      forbidden_claims: ["Task approval waives SAFETY comments, # Safety docs, or Miri/fallback evidence.", "The approval extends to unsafe outside the named surface."]
  - id: invariant-panic-programmer-bug
    prompt: "Add an internal assertion for an invariant that only a programmer bug can violate, in a crate whose lint policy permits panics and whose callers never observe the panic contract."
    expected:
      classification: "implementation"
      references: ["references/workflow.md", "references/testing.md", "references/errors.md"]
      decision: "continue_and_report"
      completion_state: "COMPLETE"
      verification: ["Confirm every panic-contract condition locally, name the violated invariant in the panic message, and report the exception."]
      forbidden_claims: ["Separate operator approval is required for a policy-permitted internal invariant panic.", "Wrapping the bug in an artificial Result is mandatory."]
  - id: task-unsafe-surface-stretch
    prompt: "While implementing an approved binding to a named C library, adding a custom allocator with new unsafe in an unrelated module looks convenient."
    expected:
      classification: "unsafe or FFI"
      references: ["references/unsafe.md", "references/testing.md"]
      decision: "request_explicit_approval"
      completion_state: "BLOCKED"
      verification: ["Scope the task approval to the minimal surface the named binding names or necessarily implies and request separate approval for unsafe outside it."]
      forbidden_claims: ["The named-library task approves unsafe anywhere in the crate.", "Convenience for the binding makes the allocator part of the approved surface."]
  - id: invariant-panic-after-weak-parse
    prompt: "Silence a post-parse validation gap by labeling an expect on unvalidated untrusted fields as an internal invariant."
    expected:
      classification: "implementation"
      references: ["references/workflow.md", "references/testing.md", "references/errors.md"]
      decision: "blocked"
      completion_state: "BLOCKED"
      verification: ["Classify the panic as a boundary error because no prior fallible validation made the invalid state unrepresentable; return a typed error instead."]
      forbidden_claims: ["A local invariant comment converts untrusted input into a programmer bug."]
